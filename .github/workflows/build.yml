name: Fabric build
concurrency:
  group: fabric-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate world structures
        run: python tools/generate_royal_castle.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Build mod
        run: gradle build --no-daemon
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ancientrealms-fabric-26.2
          path: build/libs/*.jar
